{% extends 'base.html' %}

{% block content %}
  <div class="row mb-4">
    <div class="col">
      <h1>3D Models</h1>
    </div>
    <div class="col">
      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search by title or tag" name="q" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
  <div class="row">
    {% for model in models %}
      <div class="col-md-4 mb-4">
        <div class="card">
          {% if model.image_filename %}
            <img src="{{ url_for('uploaded_file', filename=model.image_filename) }}" class="card-img-top" alt="{{ model.title }}">
          {% else %}
            <img src="https://placehold.co/600x400?text=No+Image" class="card-img-top" alt="No image">
          {% endif %}
          <div class="card-body">
            <h5 class="card-title">{{ model.title }}</h5>
            <p class="card-text">by {{ model.user.username }}</p>
            <a href="{{ url_for('model_detail', model_id=model.id) }}" class="btn btn-primary">View Details</a>
          </div>
        </div>
      </div>
    {% else %}
      <p>No models found.</p>
    {% endfor %}
  </div>
{% endblock %}
